name: Keep warm

# The free Render instance sleeps after 15 minutes idle. Ping it so a visitor
# never hits a cold start. Set the APP_URL repo variable to the deployed URL
# (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.APP_URL }}"
          if [ -z "$URL" ]; then
            echo "APP_URL variable not set; skipping."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "$URL/api/health" || echo "000")
          echo "GET $URL/api/health -> $code"
          [ "$code" = "200" ]

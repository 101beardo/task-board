name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci is avoided here: npm omits transitive @emnapi/* deps of the
      # Linux-only native binaries (oxide, lightningcss, swc) from a lockfile
      # generated on macOS, which makes `npm ci` fail on the Linux runner.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
